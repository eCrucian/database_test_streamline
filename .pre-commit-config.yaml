repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
      - id: bandit
        name: bandit (SAST)
        entry: uv run bandit -q -r src -c pyproject.toml
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest (100% coverage)
        entry: uv run pytest
        language: system
        pass_filenames: false
