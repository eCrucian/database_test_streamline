[project]
name = "dbts"
version = "0.1.0"
description = "Mapeia repos, propõe e executa testes de dados com trilha de auditoria"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17.0",
    "boto3>=1.43.116",
    "duckdb>=1.5.6",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "openai>=3.35.1",
    "pyarrow>=26.0.0",
    "pydantic>=2.7",
    "python-hcl2>=8.1.4",
    "sqlglot>=30.24.0",
    "typer>=0.12",
]

[project.scripts]
dbts = "dbts.cli.app:app"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "boto3-stubs[athena]>=1.43.116",
    "mypy>=1.10",
    "pip-audit>=2.10.1",
    "pre-commit>=3.7",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C90", "SIM", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=dbts --cov-branch --cov-report=term-missing --cov-fail-under=100"
markers = ["integration: fluxo ponta a ponta (repos git + DuckDB local); roda no CI só para a main"]
filterwarnings = ["error"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "@overload", "class .*\\(Protocol\\):"]

[tool.bandit]
exclude_dirs = ["tests"]
